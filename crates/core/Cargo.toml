[package]
name = "midlang-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
async-trait = "0.1.92"
chrono = "0.4.45"
cached = "4"
redb = "4.2.0"
scc = "3.8.8"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio.workspace = true
tokio-util = { version = "0.7.19" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v5"] }
