[package]
name = "midlang-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.92"
chrono = "0.4.45"
lru = "0.18.4"
redb = "4.2.0"
scc = "3.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19" }
uuid = { version = "1.26.1", features = ["v5"] }
