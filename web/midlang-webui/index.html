<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>midlang-webui</title>
    <script>
      // Applies the persisted theme before React mounts so the first paint matches
      // the stored preference. Keep the storage key in sync with hooks/use-theme.ts.
      ;(function () {
        try {
          var stored = window.localStorage.getItem("midlang-webui:theme")
          var preference = stored === null ? "system" : JSON.parse(stored).state.preference
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var isDark = preference === "dark" || (preference !== "light" && prefersDark)
          document.documentElement.classList.toggle("dark", isDark)
        } catch (error) {
          console.warn("midlang-webui: unable to restore the stored theme preference", error)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
