server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The console routes on the client side, so any unknown path must fall back
    # to index.html for the router to resolve it in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
